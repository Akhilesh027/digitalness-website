<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#130150"
    />

    <!-- Primary SEO -->
    <title>
      Digitalness | Digital Growth Agency
    </title>

    <meta
      name="description"
      content="Digitalness — digital marketing, web development, branding, SEO, advertising, content, analytics and business growth solutions."
    />

    <meta
      name="keywords"
      content="Digitalness, digital marketing agency, web development, branding, SEO, Meta Ads, Google Ads, social media marketing, Hyderabad digital agency"
    />

    <meta
      name="author"
      content="Digitalness Industries LLP"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Digitalness | Digital Growth Agency"
    />

    <meta
      property="og:description"
      content="Strategy, marketing, websites, branding, SEO, creative and technology working together to build stronger digital growth systems."
    />

    <meta
      property="og:image"
      content="/digitalness-logo.png"
    />

    <meta
      property="og:site_name"
      content="Digitalness"
    />

    <!-- Twitter / Social Preview -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Digitalness | Digital Growth Agency"
    />

    <meta
      name="twitter:description"
      content="Strategy, marketing, websites, branding, SEO, creative and technology working together to build stronger digital growth systems."
    />

    <meta
      name="twitter:image"
      content="/digitalness-logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
