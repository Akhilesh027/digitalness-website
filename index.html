<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#130150"
    />

    <!-- Primary SEO -->
    <title data-rh="true">Digitalness | Digital Growth Agency</title>

    <meta
      data-rh="true"
      name="description"
      content="Digitalness — digital marketing, web development, branding, SEO, advertising, content, analytics and business growth solutions."

    <link
      data-rh="true"
      rel="canonical"
      href="https://digitalness.co.in/"
    />

    <meta
      name="keywords"
      content="Digitalness, digital marketing agency, web development, branding, SEO, Meta Ads, Google Ads, social media marketing, Hyderabad digital agency"

      name="author"
      content="Digitalness Industries LLP"
    />

      rel="icon"

    <link

    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

      property="og:url"
      content="https://digitalness.co.in/"
    />

    <meta
      property="og:title"
      content="Digitalness | Digital Growth Agency"

      content="https://digitalness.co.in/digitalness-logo.png"
    />

    <meta
      property="og:site_name"
      content="Digitalness"
    />

      name="twitter:card"
      content="summary_large_image"
